name: Reproduce paper results

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  reproduce:
    name: Generate figures, data, and PDF report
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra

      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Generate reproduction results
        run: |
          python scripts/run_reproduction.py --profile paper

      - name: Build reproduction PDF
        run: |
          cd docs/latex
          pdflatex -interaction=nonstopmode documentation.tex
          bibtex documentation
          pdflatex -interaction=nonstopmode documentation.tex
          pdflatex -interaction=nonstopmode documentation.tex
          mkdir -p ../../results/docs
          cp documentation.pdf ../../results/docs/reproduction_report.pdf

      - name: Upload full generated results
        uses: actions/upload-artifact@v4
        with:
          name: paper-results
          path: results/
          if-no-files-found: error
          retention-days: 30

      - name: Upload PDF report only
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-report-pdf
          path: results/docs/reproduction_report.pdf
          if-no-files-found: error
          retention-days: 30
