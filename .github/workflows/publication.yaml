name: Publication

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publication:
    name: Generate publication PDF
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt -e .

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-lang-spanish \
            texlive-science \
            latexmk \
            zip

      - name: Run tests
        run: |
          uv run pytest tests/ -v

      - name: Clean previous generated results
        run: |
          uv run python scripts/clean_results.py

      - name: Generate all numerical results
        run: |
          uv run python scripts/run_reproduction.py --profile publication

      - name: Build publication PDF
        run: |
          cd docs/latex
          latexmk -pdf -interaction=nonstopmode -halt-on-error documentation.tex
          mkdir -p ../../results/publication
          cp documentation.pdf ../../results/publication/publication.pdf

      - name: Package publication bundle
        run: |
          publication_tag="publication-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          mkdir -p results/publication
          zip -r "results/publication/hermitian-code-${publication_tag}.zip" \
            results/manifest.json \
            results/figures \
            results/field_profiles \
            results/band_structures \
            results/publication/publication.pdf
          {
            echo "PUBLICATION_TAG=${publication_tag}"
            echo "SHORT_SHA=${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"

      - name: Upload publication PDF
        uses: actions/upload-artifact@v4
        with:
          name: publication-pdf
          path: results/publication/publication.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated results
        uses: actions/upload-artifact@v4
        with:
          name: publication-results
          path: results/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$PUBLICATION_TAG" \
            "results/publication/publication.pdf" \
            "results/publication/hermitian-code-${PUBLICATION_TAG}.zip" \
            --target "$GITHUB_SHA" \
            --title "Hermitian Code publication ${PUBLICATION_TAG}" \
            --notes "Automated publication package for ${SHORT_SHA}. Includes the generated PDF, figures, numerical data, and manifest."
