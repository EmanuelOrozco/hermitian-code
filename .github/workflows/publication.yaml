name: Publication

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  publication:
    name: Generate publication PDF
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt -e .

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            texlive-lang-spanish \
            texlive-science \
            latexmk

      - name: Run tests
        run: |
          uv run pytest tests/ -v

      - name: Clean previous generated results
        run: |
          uv run python scripts/clean_results.py

      - name: Generate all numerical results
        run: |
          uv run python scripts/run_reproduction.py --profile publication

      - name: Build publication PDF
        run: |
          cd docs/latex
          latexmk -pdf -interaction=nonstopmode -halt-on-error documentation.tex
          mkdir -p ../../results/publication
          cp documentation.pdf ../../results/publication/publication.pdf

      - name: Upload publication PDF
        uses: actions/upload-artifact@v4
        with:
          name: publication-pdf
          path: results/publication/publication.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated results
        uses: actions/upload-artifact@v4
        with:
          name: publication-results
          path: results/
          if-no-files-found: error
          retention-days: 30
